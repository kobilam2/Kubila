<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Storefront</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- PapaParse for real-time Google Sheets CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --badge-stock: #10b981;
      --badge-out: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 2.5rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      max-width: 420px;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .filter-pills {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .pill:hover, .pill.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .card-img-wrapper {
      width: 100%;
      height: 240px;
      background: #111827;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .category-badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 600;
    }

    .stock-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--badge-stock);
      font-weight: 600;
    }

    .stock-badge.out {
      background: rgba(239, 68, 68, 0.15);
      color: var(--badge-out);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.4rem;
      color: var(--text-main);
    }

    .card-sku {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .card-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
    }

    .price {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
    }

    .buy-btn {
      background: var(--accent);
      color: #000;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .buy-btn:hover {
      background: var(--accent-hover);
    }

    .status-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Online Storefront</h1>
      <p>Real-time stock straight from Google Sheets</p>
    </header>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by name, category, or SKU...">
      </div>
      <div class="filter-pills" id="categoryFilters">
        <button class="pill active" data-category="ALL">All Products</button>
      </div>
    </div>

    <div class="product-grid" id="productGrid">
      <div class="status-message">Loading inventory...</div>
    </div>
  </div>

  <script>
    // 1. Paste your published Google Sheet CSV link here:
    const SHEET_CSV_URL = "YOUR_GOOGLE_SHEET_CSV_URL_HERE";

    let allProducts = [];
    let activeCategory = "ALL";
    let searchQuery = "";

    function loadInventory() {
      // If no link is configured yet, fall back to initial items
      if (SHEET_CSV_URL === "YOUR_GOOGLE_SHEET_CSV_URL_HERE" || !SHEET_CSV_URL) {
        allProducts = [
          { Title: "Korean Trendy Silver-Tone Double Hoop Earrings", Category: "Earrings & Studs", Price: "100", Stock: "2", SKU: "KOB-4024", Image_URL: "https://images.meesho.com/images/products/1140570734/a7iqc.avif", Meesho_Link: "https://www.meesho.com/s/p/iv2e0e" },
          { Title: "Korean mixed color enamel pearl drop earrings", Category: "Earrings & Studs", Price: "81", Stock: "1", SKU: "mak465shi", Image_URL: "https://images.meesho.com/images/products/1137170030/2agrn.avif", Meesho_Link: "https://www.meesho.com/s/p/it1i0e" },
          { Title: "Korean style blue enamel pearl earrings for women", Category: "Earrings & Studs", Price: "82", Stock: "1", SKU: "mitytu0987", Image_URL: "https://images.meesho.com/images/products/1137162350/wszam.avif", Meesho_Link: "https://www.meesho.com/s/p/it1c32" },
          { Title: "Korean style blue heart shaped hoop earrings for women", Category: "Earrings & Studs", Price: "94", Stock: "2", SKU: "savi-tha2345", Image_URL: "https://images.meesho.com/images/products/1137125148/h41xt.avif", Meesho_Link: "https://www.meesho.com/s/p/it0jdo" }
        ];
        initFilters();
        renderProducts();
        return;
      }

      // Fetch live CSV using PapaParse
      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allProducts = results.data.filter(row => row.Title && row.Title.trim() !== "");
          initFilters();
          renderProducts();
        },
        error: function(err) {
          document.getElementById("productGrid").innerHTML = 
            `<div class="status-message">Failed to load inventory. Check your sheet sharing permissions.</div>`;
        }
      });
    }

    function initFilters() {
      const filterContainer = document.getElementById("categoryFilters");
      const categories = [...new Set(allProducts.map(p => p.Category).filter(Boolean))];
      
      // Preserve "All Products" button
      filterContainer.innerHTML = '<button class="pill active" data-category="ALL">All Products</button>';

      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "pill";
        btn.dataset.category = cat;
        btn.textContent = cat;
        btn.addEventListener("click", () => {
          document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
          btn.classList.add("active");
          activeCategory = cat;
          renderProducts();
        });
        filterContainer.appendChild(btn);
      });

      filterContainer.querySelector('[data-category="ALL"]').addEventListener("click", (e) => {
        document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
        e.target.classList.add("active");
        activeCategory = "ALL";
        renderProducts();
      });
    }

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";

      const filtered = allProducts.filter(item => {
        const matchesCategory = activeCategory === "ALL" || item.Category === activeCategory;
        const matchesSearch = 
          (item.Title || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
          (item.SKU || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
          (item.Category || "").toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="status-message">No matching items found.</div>`;
        return;
      }

      filtered.forEach(p => {
        const stockNum = parseInt(p.Stock, 10) || 0;
        const isOutOfStock = stockNum <= 0;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${p.Image_URL || 'https://via.placeholder.com/300x300?text=No+Image'}" alt="${p.Title}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'">
          </div>
          <div class="card-content">
            <div class="badge-row">
              <span class="category-badge">${p.Category || 'General'}</span>
              <span class="stock-badge ${isOutOfStock ? 'out' : ''}">${isOutOfStock ? 'Out of Stock' : `${stockNum} in stock`}</span>
            </div>
            <h3 class="card-title">${p.Title}</h3>
            <div class="card-sku">SKU: ${p.SKU || 'N/A'}</div>
            <div class="card-footer">
              <span class="price">₹${p.Price || '0'}</span>
              ${p.Meesho_Link ? `<a href="${p.Meesho_Link}" target="_blank" rel="noopener noreferrer" class="buy-btn">Order Now</a>` : ''}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      renderProducts();
    });

    loadInventory();
  </script>
</body>
</html>
