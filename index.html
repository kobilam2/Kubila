<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kubila Jewellery Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- PapaParse for real-time Google Sheets CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #d4af37; /* Metallic Warm Gold matching the sticker logo */
      --accent-hover: #b8901c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --badge-stock: #10b981;
      --badge-out: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 2.5rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Brand Header Styling with New Circular Sticker Logo */
    header {
      text-align: center;
      margin-bottom: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-logo-container {
      position: relative;
      width: 130px;
      height: 130px;
      margin-bottom: 1.25rem;
    }

    /* Sticker Style Visual recreation of KOBILA/KUBILA Badge */
    .sticker-logo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px double var(--accent);
      background: radial-gradient(circle, #251b08 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--accent);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(212, 175, 55, 0.2);
      padding: 10px;
    }

    .sticker-diamond {
      font-size: 0.9rem;
      line-height: 1;
      margin-bottom: -1px;
    }

    .sticker-k {
      font-family: serif;
      font-size: 3rem;
      font-weight: 500;
      line-height: 1.1;
      position: relative;
      display: inline-block;
      margin-top: -5px;
    }

    .sticker-k::after {
      content: '✦';
      font-size: 0.75rem;
      position: absolute;
      top: 15px;
      right: -15px;
    }

    .sticker-brand-name {
      font-family: serif;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      font-weight: bold;
      margin-top: -5px;
      text-transform: uppercase;
    }

    .sticker-subtext {
      font-size: 0.38rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.9;
      margin-top: 1px;
    }

    .sticker-footer-star {
      font-size: 0.45rem;
      margin-top: 2px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      letter-spacing: -0.01em;
      color: #fff;
    }

    header p {
      color: var(--accent);
      font-size: 0.95rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.9;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      max-width: 420px;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .filter-pills {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .pill:hover, .pill.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .card-img-wrapper {
      width: 100%;
      height: 240px;
      background: #111827;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .category-badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 600;
    }

    .stock-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--badge-stock);
      font-weight: 600;
    }

    .stock-badge.out {
      background: rgba(239, 68, 68, 0.15);
      color: var(--badge-out);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.4rem;
      color: var(--text-main);
    }

    .card-sku {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .card-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
    }

    .price {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .buy-btn {
      background: var(--accent);
      color: #000;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .buy-btn:hover {
      background: var(--accent-hover);
    }

    .status-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <!-- Circular Brand Custom Sticker Logo matching image_4.png -->
      <div class="brand-logo-container">
        <div class="sticker-logo">
          <div class="sticker-diamond">♦</div>
          <div class="sticker-k">K</div>
          <div class="sticker-brand-name">Kubila</div>
          <div class="sticker-subtext">JEWELLERY COLLECTION</div>
          <div class="sticker-footer-star">✦</div>
        </div>
      </div>
      <h1>Kubila Jewellery Collection</h1>
      <p>JEWELLERY THAT SHINES</p>
    </header>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by name, category, or SKU...">
      </div>
      <div class="filter-pills" id="categoryFilters">
        <button class="pill active" data-category="ALL">All Products</button>
      </div>
    </div>

    <div class="product-grid" id="productGrid">
      <div class="status-message">Loading collection...</div>
    </div>
  </div>

  <script>
    // Live CSV query endpoint (bypasses CORS using your direct sheet ID)
    const SHEET_ID = "1ewfRaVosGhRDP2olfic69dQjX7R4HqVqiJ4-88S_n5U";
    const DIRECT_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;

    let allProducts = [];
    let activeCategory = "ALL";
    let searchQuery = "";

    function loadInventory() {
      Papa.parse(DIRECT_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          // Normalize column headers and clean quotes
          allProducts = results.data
            .map(row => {
              const cleaned = {};
              for (const key in row) {
                const cleanKey = key.replace(/['"]+/g, '').trim();
                const val = typeof row[key] === 'string' ? row[key].replace(/^["']|["']$/g, '').trim() : row[key];
                cleaned[cleanKey] = val;
              }
              return cleaned;
            })
            .filter(row => row.Title && row.Title.trim() !== "");

          if (allProducts.length === 0) {
            document.getElementById("productGrid").innerHTML = 
              `<div class="status-message">No products found in the sheet.</div>`;
            return;
          }

          initFilters();
          renderProducts();
        },
        error: function(err) {
          console.error("PapaParse error:", err);
          document.getElementById("productGrid").innerHTML = 
            `<div class="status-message">Failed to load inventory. Please check that Google Sheet sharing is set to "Anyone with the link can view".</div>`;
        }
      });
    }

    function initFilters() {
      const filterContainer = document.getElementById("categoryFilters");
      const categories = [...new Set(allProducts.map(p => p.Category).filter(Boolean))];
      
      filterContainer.innerHTML = '<button class="pill active" data-category="ALL">All Products</button>';

      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "pill";
        btn.dataset.category = cat;
        btn.textContent = cat;
        btn.addEventListener("click", () => {
          document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
          btn.classList.add("active");
          activeCategory = cat;
          renderProducts();
        });
        filterContainer.appendChild(btn);
      });

      filterContainer.querySelector('[data-category="ALL"]').addEventListener("click", (e) => {
        document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
        e.target.classList.add("active");
        activeCategory = "ALL";
        renderProducts();
      });
    }

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";

      const filtered = allProducts.filter(item => {
        const matchesCategory = activeCategory === "ALL" || item.Category === activeCategory;
        const matchesSearch = 
          (item.Title || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
          (item.SKU || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
          (item.Category || "").toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="status-message">No matching items found.</div>`;
        return;
      }

      filtered.forEach(p => {
        const stockNum = parseInt(p.Stock, 10) || 0;
        const isOutOfStock = stockNum <= 0;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${p.Image_URL || 'https://via.placeholder.com/300x300?text=No+Image'}" alt="${p.Title}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'">
          </div>
          <div class="card-content">
            <div class="badge-row">
              <span class="category-badge">${p.Category || 'General'}</span>
              <span class="stock-badge ${isOutOfStock ? 'out' : ''}">${isOutOfStock ? 'Out of Stock' : `${stockNum} in stock`}</span>
            </div>
            <h3 class="card-title">${p.Title}</h3>
            <div class="card-sku">SKU: ${p.SKU || 'N/A'}</div>
            <div class="card-footer">
              <span class="price">₹${p.Price || '0'}</span>
              ${p.Meesho_Link ? `<a href="${p.Meesho_Link}" target="_blank" rel="noopener noreferrer" class="buy-btn">Order Now</a>` : ''}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      renderProducts();
    });

    loadInventory();
  </script>
</body>
</html>
